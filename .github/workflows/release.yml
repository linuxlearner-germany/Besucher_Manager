name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish as a container image"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag and versions
        run: |
          node - <<'NODE'
          const tag = process.env.RELEASE_TAG;
          const version = tag?.match(/^v(\d+\.\d+\.\d+)$/)?.[1];
          if (!version) throw new Error(`Invalid release tag: ${tag}`);
          for (const file of ["package.json", "apps/backend/package.json", "apps/frontend/package.json"]) {
            if (require(`./${file}`).version !== version) throw new Error(`${file} does not match ${tag}`);
          }
          const lock = require("./package-lock.json");
          for (const entry of ["", "apps/backend", "apps/frontend"]) {
            if (lock.packages[entry]?.version !== version) throw new Error(`package-lock.json ${entry || "root"} does not match ${tag}`);
          }
          NODE
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/master

      - name: Verify existing release for manual image publish
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --json tagName --jq '.tagName'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Package release
        if: github.event_name == 'push'
        run: bash scripts/ops/package_release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"

      - name: Publish versioned container image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/besucher-manager:${RELEASE_TAG}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --build-arg "APP_COMMIT=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$image" .
          docker push "$image"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/besucher-manager-$RELEASE_TAG.tar.gz" \
            "$RUNNER_TEMP/release/besucher-manager-$RELEASE_TAG.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Besucher Manager $RELEASE_TAG" \
            --notes "Vor einem Produktiv-Update ein geprüftes SQL-Backup erstellen; siehe DEPLOYMENT.md."
