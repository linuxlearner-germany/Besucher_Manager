name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and versions
        run: |
          node - <<'NODE'
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag?.match(/^v(\d+\.\d+\.\d+)$/)?.[1];
          if (!version) throw new Error(`Invalid release tag: ${tag}`);
          for (const file of ["package.json", "apps/backend/package.json", "apps/frontend/package.json"]) {
            if (require(`./${file}`).version !== version) throw new Error(`${file} does not match ${tag}`);
          }
          const lock = require("./package-lock.json");
          for (const entry of ["", "apps/backend", "apps/frontend"]) {
            if (lock.packages[entry]?.version !== version) throw new Error(`package-lock.json ${entry || "root"} does not match ${tag}`);
          }
          NODE
          git merge-base --is-ancestor HEAD origin/master

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Package release
        run: bash scripts/ops/package_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/besucher-manager-$GITHUB_REF_NAME.tar.gz" \
            "$RUNNER_TEMP/release/besucher-manager-$GITHUB_REF_NAME.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Besucher Manager $GITHUB_REF_NAME" \
            --notes "Vor einem Produktiv-Update ein geprüftes SQL-Backup erstellen; siehe DEPLOYMENT.md."
